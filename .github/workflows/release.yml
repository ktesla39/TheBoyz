name: Publish signed launcher release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows updater
    runs-on: windows-latest
    env:
      VITE_GITHUB_REPOSITORY: ${{ github.repository }}
      VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID || vars.VITE_MICROSOFT_CLIENT_ID || 'fa5a840b-f490-4075-aaa9-83a6763c602e' }}
      VITE_TAURI_UPDATER_ENABLED: 'true'
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate CurseForge API key
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_KEY)) {
            Write-Warning 'CURSEFORGE_API_KEY is not configured; CurseForge will require users to enter a key in Settings.'
          } else {
            $headers = @{ 'x-api-key' = $env:CURSEFORGE_API_KEY }
            try {
              $response = Invoke-WebRequest -SkipHttpErrorCheck -Uri 'https://api.curseforge.com/v1/mods/search?gameId=432&pageSize=1' -Headers $headers -Method Get
              if ($response.StatusCode -ge 400) {
                Write-Warning "CurseForge API key check returned HTTP $($response.StatusCode); users can configure a personal key in Launcher Settings."
              }
            } catch {
              Write-Warning 'CurseForge API key check could not reach the service; release will continue and users can configure a personal key in Launcher Settings.'
            }
          }

      - name: Prepare updater configuration
        run: node scripts/prepare-updater.mjs

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID || vars.VITE_MICROSOFT_CLIENT_ID || 'fa5a840b-f490-4075-aaa9-83a6763c602e' }}
          VITE_TAURI_UPDATER_ENABLED: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: The Boys ${{ github.ref_name }}
          releaseBody: |
            Version 1.1.3 fixes Minecraft instance importing (including launcher profile folders), opens instance folders faster, and includes the launcher reliability fixes verified in this rollout.
          releaseDraft: false
          prerelease: false
          tauriScript: npm run tauri
          args: --bundles nsis
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
