name: Publish signed launcher release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows updater
    runs-on: windows-latest
    env:
      VITE_GITHUB_REPOSITORY: ${{ github.repository }}
      VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID || vars.VITE_MICROSOFT_CLIENT_ID || 'fa5a840b-f490-4075-aaa9-83a6763c602e' }}
      VITE_TAURI_UPDATER_ENABLED: 'true'
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare updater configuration
        run: node scripts/prepare-updater.mjs

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID || vars.VITE_MICROSOFT_CLIENT_ID || 'fa5a840b-f490-4075-aaa9-83a6763c602e' }}
          VITE_TAURI_UPDATER_ENABLED: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: The Boys ${{ github.ref_name }}
          releaseBody: See the release notes below for changes and fixes.
          releaseDraft: false
          prerelease: false
          tauriScript: npm run tauri
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
