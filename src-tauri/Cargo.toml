[package]
name = "the-boys-launcher"
version = "1.1.3"
description = "A Next-Generation Minecraft Launcher Built with Rust, Tauri, React & TypeScript"
authors = ["ktesla"]
edition = "2021"

[lib]
name = "the_boys_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-os = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.8", features = ["v3", "v4", "fast-rng"] }
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"
keyring = { version = "3", features = ["windows-native"] }
dotenvy = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
shell-words = "1"

[dev-dependencies]
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
